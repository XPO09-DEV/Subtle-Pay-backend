name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm install --no-audit --no-fund
      - name: Check local bootstrap script syntax
        run: node --check scripts/ensure-local-env.mjs
      - name: Smoke-test local development bootstrap
        run: node scripts/ensure-local-env.mjs
      - name: Type-check backend
        run: npm run typecheck
